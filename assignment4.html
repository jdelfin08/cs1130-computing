    <main>
      <section class="page-head">
        <h1>Simple payroll,<br><em>in one step.</em></h1>
        <p>Hours and rate in. Gross pay, deductions and net pay out.</p>
      </section>

      <div class="panel">
        <div class="panel-head"><span class="icon">&#8369;</span><h2>Employee details</h2></div>

        <label for="name">Employee name</label>
        <input type="text" id="name" placeholder="Name">

        <div class="two">
          <div>
            <label for="hours">Hours worked this week</label>
            <input type="number" id="hours" placeholder="e.g. 45">
          </div>
          <div>
            <label for="rate">Pay rate per hour (PHP)</label>
            <input type="number" id="rate" placeholder="e.g. 100">
          </div>
        </div>

        <button class="btn dark spaced" onclick="computePayroll()">Compute pay</button>
        <p class="error" id="error"></p>
      </div>

      <div class="panel" id="payslip"></div>
    </main>
