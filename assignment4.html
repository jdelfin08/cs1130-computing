<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment #4 – Simple Payroll</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Simple Payroll</h1>
  <p><a href="index.html">Back to home</a></p>

  <div class="box">
    <label for="name">Employee name</label>
    <input type="text" id="name" placeholder="Name">

    <label for="hours">Hours worked this week</label>
    <input type="number" id="hours" placeholder="e.g. 45">

    <label for="rate">Pay rate per hour (PHP)</label>
    <input type="number" id="rate" placeholder="e.g. 100">

    <button onclick="computePayroll()">Compute Pay</button>
    <p class="error" id="error"></p>
  </div>

  <div class="box" id="payslip"></div>

  <script src="assignment4.js"></script>
</body>
</html>
